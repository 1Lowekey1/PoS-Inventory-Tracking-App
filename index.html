<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PopPOS</title>
    <meta name="description" content="Offline point-of-sale and inventory for pop-ups, markets and small cafés.">
    <meta name="theme-color" content="#faf7f2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PopPOS">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="shell">
        <nav id="nav" class="nav" aria-label="Main"></nav>
        <div class="main">
            <header id="status" class="status"></header>
            <main id="view" class="view"></main>
        </div>
    </div>
    <div id="modals"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="tip" class="tip" role="tooltip" hidden></div>
    <noscript><p style="padding:2rem">PopPOS needs JavaScript enabled.</p></noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
